[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0

[Variables]
Accent=0,220,255
StrokeA=90
BgColor=18,18,24,235

[Bg]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 2,2,126,60,14 | Fill Color #BgColor# | StrokeWidth 2 | Stroke Color #Accent#,#StrokeA#
LeftMouseUpAction=["C:\Program Files (x86)\qres\QRes.exe" /x:1920 /y:1080 /r:144]
MouseOverAction=[!SetVariable StrokeA 255][!UpdateMeter Bg][!Redraw]
MouseLeaveAction=[!SetVariable StrokeA 90][!UpdateMeter Bg][!Redraw]
ToolTipText=Set screen to 144 Hz

[Number]
Meter=String
Text=144
X=46
Y=31
StringAlign=CenterCenter
FontFace=Segoe UI
FontWeight=700
FontSize=28
FontColor=#Accent#
AntiAlias=1

[Unit]
Meter=String
Text=Hz
X=88
Y=38
StringAlign=LeftCenter
FontFace=Segoe UI
FontWeight=600
FontSize=11
FontColor=255,255,255,150
AntiAlias=1